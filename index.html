<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b14" id="metaTheme" />

  <meta name="description" content="影视搜 - 在线影视搜索与播放，聚合多源影视资源，支持m3u8高清播放。" />
  <title>影视搜 · 高清在线影视</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237c5cff'/%3E%3Cpath d='M24 20l20 12-20 12z' fill='white'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://img.dytt-tupian.com" crossorigin />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ys-theme");
        if (!t) t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand" aria-label="影视搜首页">
        <span class="brand-mark">
          <svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#7c5cff"/>
                <stop offset="1" stop-color="#e055a0"/>
              </linearGradient>
            </defs>
            <rect width="64" height="64" rx="16" fill="url(#bg)"/>
            <path d="M25 20l20 12-20 12z" fill="white"/>
          </svg>
        </span>
        <span class="brand-text">影视搜</span>
      </a>
      <div class="search-slot">
        <form class="search" id="searchForm" role="search" autocomplete="off">
          <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M10 2a8 8 0 105.3 14l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/>
          </svg>
          <input id="searchInput" class="search-input" type="search" placeholder="搜索电影、电视剧、动漫…" enterkeyhint="search" />
          <button class="search-btn" type="submit">搜索</button>
        </form>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="切换深色/浅色主题" title="切换主题">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.8A9 9 0 1111.2 3a7 7 0 109.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 100 10 5 5 0 000-10zM12 1a1 1 0 011 1v2a1 1 0 11-2 0V2a1 1 0 011-1zm0 18a1 1 0 011 1v2a1 1 0 11-2 0v-2a1 1 0 011-1zM4.2 4.2a1 1 0 011.4 0L7 5.6a1 1 0 11-1.4 1.4L4.2 5.6a1 1 0 010-1.4zm12.4 12.4a1 1 0 011.4 0l1.4 1.4a1 1 0 11-1.4 1.4l-1.4-1.4a1 1 0 010-1.4zM1 12a1 1 0 011-1h2a1 1 0 110 2H2a1 1 0 01-1-1zm18 0a1 1 0 011-1h2a1 1 0 110 2h-2a1 1 0 01-1-1zM4.2 19.8a1 1 0 010-1.4l1.4-1.4a1 1 0 111.4 1.4l-1.4 1.4a1 1 0 01-1.4 0zm12.4-12.4a1 1 0 010-1.4l1.4-1.4a1 1 0 111.4 1.4l-1.4 1.4a1 1 0 01-1.4 0z"/></svg>
      </button>
    </div>
  </header>

  <main id="app" class="app">
    <section id="view-home" class="view"></section>
  </section>

  <!-- Detail Modal -->
  <div class="modal" id="detailModal" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="modal-close" data-close aria-label="关闭">&times;</button>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>

  <!-- Player View -->
  <section class="player-view" id="playerView" aria-hidden="true">
    <div class="player-wrap">
      <div class="player-top">
        <button class="icon-btn" id="playerBack" aria-label="返回">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15 5l-7 7 7 7 1.4-1.4L10.8 12 16.4 6.4z"/></svg>
          <span>返回</span>
        </button>
        <div class="player-title" id="playerTitle"></div>
      </div>
      <div class="player-stage">
        <video id="video" controls playsinline preload="metadata"></video>
        <div class="player-loading" id="playerLoading">
          <div class="spinner"></div>
          <span>正在加载视频…</span>
        </div>
        <div class="player-error" id="playerError" aria-hidden="true">
          <span>视频加载失败，请尝试其他源或剧集。</span>
        </div>
      </div>
      <div class="player-eps" id="playerEps"></div>
    </div>
  </section>

  <footer class="footer">
    <p>本站仅作学习交流，聚合展示公开影视资源，不存储任何音视频内容。播放内容均来自第三方接口。</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="/js/app.js" defer></script>
</body>
</html>
